name: Test Stock Market Data

on:
  workflow_dispatch:

jobs:
  test-market-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Test stock prices
        run: |
          python -c "import yfinance as yf; data = yf.download(['AAPL', 'BARC.L'], period='5d', progress=False); print(data[['Close']].tail()); assert not data.empty, 'No stock data returned'"
```

