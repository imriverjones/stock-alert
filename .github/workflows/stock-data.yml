```yaml
name: Stock Data Test
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install yfinance
      - run: python -c "import yfinance as yf; print(yf.Ticker('AAPL').history(period='5d')['Close'].tail())"
```
